name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint

      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: supabase start
      - run: npm test

      - name: Export Supabase credentials for the e2e web server
        run: |
          status=$(supabase status -o env)
          api_url=$(grep '^API_URL=' <<< "$status" | sed -E 's/^API_URL="(.*)"$/\1/')
          anon_key=$(grep '^ANON_KEY=' <<< "$status" | sed -E 's/^ANON_KEY="(.*)"$/\1/')
          {
            echo "SUPABASE_URL=$api_url"
            echo "SUPABASE_KEY=$anon_key"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - run: npm run build

      - name: Check Supabase migrations apply cleanly
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Push Supabase migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push

      - name: Verify migrations fully applied
        run: |
          output=$(supabase db push --dry-run 2>&1)
          echo "$output" | sed -E 's#(postgres(ql)?://[^:]+:)[^@]+(@)#\1***\3#g'
          if ! grep -qE "is up to date\.?$" <<< "$output"; then
            echo "::error::Pending migrations remain after db push — aborting before deploy."
            exit 1
          fi

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
