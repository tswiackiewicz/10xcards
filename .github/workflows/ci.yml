name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege, matching the style ai-code-review.yml already uses. Nothing here
# writes through GITHUB_TOKEN: `ci` and `code-review-package` only read the tree, and
# `migration-dry-run` / `deploy` authenticate to Supabase and Cloudflare with their own
# secrets. Declared at the top level so a new job cannot silently inherit the repo default.
permissions:
  contents: read

# Third-party actions below are pinned to full commit SHAs — a mutable tag repoint would
# otherwise get whatever the default token grants. actions/checkout and actions/setup-node
# are deliberately left on tags: they are first-party GitHub actions, and pinning them here
# only would break consistency with the repo's four other workflows.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync

      # The repo's only YAML validation. Inside the required check on purpose: actionlint
      # is fast, hermetic and has no external dependency, so it carries none of the
      # flakiness argument that keeps the code-review package in its own job.
      # raven-actions/actionlint, not rhysd/actionlint — upstream ships a binary and a
      # Docker image but no action.yml at its root.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - run: npm run lint

      # Applies every migration to a fresh local stack. After the production dry-run moved
      # to `migration-dry-run` (push-only), this is the only migration coverage a PR gets:
      # it catches a migration that cannot apply at all, but nothing about divergence from
      # production's actual schema state.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - run: supabase start
      - run: npm test

      - name: Export Supabase credentials for the e2e web server
        run: |
          status=$(supabase status -o env)
          api_url=$(grep '^API_URL=' <<< "$status" | sed -E 's/^API_URL="(.*)"$/\1/')
          anon_key=$(grep '^ANON_KEY=' <<< "$status" | sed -E 's/^ANON_KEY="(.*)"$/\1/')
          {
            echo "SUPABASE_URL=$api_url"
            echo "SUPABASE_KEY=$anon_key"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

  # A sibling of `ci`, not a step inside it, and deliberately not required. A step would be
  # blocking immediately (required_status_checks.contexts is exactly ["ci"]) — but `ci` is
  # also what `deploy` depends on, so a flaky test in the review tool would block production
  # deploys, not merely merges. The price, stated plainly: a broken packages/code-review can
  # be merged to master, because nothing requires this job.
  code-review-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/code-review
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/code-review/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Was a step inside `ci`, which meant every PR linked the PRODUCTION Supabase project with
  # SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_ID in scope, in the same
  # job that had already run the PR branch's own npm ci, tests, build and e2e. For a same-repo
  # pull_request the workflow definition comes from the PR, so anyone with push access could
  # edit this file in a PR and print the production DB password.
  #
  # The loss is real and is not papered over: what this dry-run uniquely catches is divergence
  # against production's actual schema state, and no local run can see that. It now surfaces on
  # master rather than in the PR. `supabase start` in `ci` still catches local-apply failures
  # pre-merge. A GitHub Environment with required reviewers would restore pre-merge coverage
  # behind an approval gate; that is deliberately not this change.
  migration-dry-run:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - name: Check Supabase migrations apply cleanly
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --dry-run

  deploy:
    # Gated on the dry-run as well as `ci`, so divergence against production is reported
    # before `supabase db push` applies anything for real — the post-merge remnant of the
    # coverage the PR used to have.
    needs: [ci, migration-dry-run]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - name: Push Supabase migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push

      - name: Verify migrations fully applied
        run: |
          output=$(supabase db push --dry-run 2>&1)
          echo "$output" | sed -E 's#(postgres(ql)?://[^:]+:)[^@]+(@)#\1***\3#g'
          if ! grep -qE "is up to date\.?$" <<< "$output"; then
            echo "::error::Pending migrations remain after db push — aborting before deploy."
            exit 1
          fi

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
